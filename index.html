<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b2e">
<title>Desafío de Habilidad</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 0%, #17654c, #0a2e23 70%); color: #fff;
    padding: max(32px, env(safe-area-inset-top)) 20px 40px;
  }
  h1 { text-align: center; font-size: 30px; margin-bottom: 6px; }
  .sub { text-align: center; opacity: .75; margin-bottom: 28px; }
  .grid { display: grid; gap: 16px; max-width: 520px; margin: 0 auto; }
  a.game {
    display: flex; align-items: center; gap: 16px; text-decoration: none; color: #1c1c1c;
    background: #f6f1e7; border-radius: 18px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  a.game:active { transform: scale(.98); }
  .icon {
    width: 64px; height: 64px; border-radius: 14px; flex: none; position: relative;
    background: #0f5a43; border: 4px solid #7a4a22;
  }
  .icon i { position: absolute; width: 14px; height: 14px; border-radius: 50%; }
  .game h2 { font-size: 19px; margin-bottom: 4px; }
  .game p { font-size: 14px; color: #555; line-height: 1.35; }
</style>
</head>
<body>
  <h1>Desafío de Habilidad</h1>
  <p class="sub">Elegí un juego</p>
  <div class="grid">
    <a class="game" href="juegos/mesa-de-hoyos/">
      <div class="icon">
        <i style="left:6px;top:6px;background:#eee"></i>
        <i style="right:6px;top:6px;background:#000"></i>
        <i style="left:6px;bottom:6px;background:#000"></i>
        <i style="right:6px;bottom:6px;background:#eee"></i>
      </div>
      <div>
        <h2>Mesa de Hoyos</h2>
        <p>Inclinná el celular y embocá cada bola en el hoyo de su color.</p>
      </div>
    </a>
  </div>
</body>
</html>
